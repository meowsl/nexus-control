[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-control"
version = "0.5.6"
description = "Textual TUI + CLI for Nexus Sonatype CE: browse, download, Grype/Trivy/OSV scan, verify and upload"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "meowsl" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings[toml]>=2.14.2",
    "tomli-w>=1.2.0",
    "textual>=8.2.8",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "cryptography>=50.0.0",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "flake8>=7.3.0",
]

[project.urls]
Repository = "https://github.com/meowsl/nexus-control"

[project.scripts]
nexus-control = "nexus_control.__main__:main"
nexus-control-cli = "nexus_control.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_control*"]

[tool.setuptools.package-data]
nexus_control = ["zoo/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
